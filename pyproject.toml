[project]
name = "ipat-dissertation"
version = "0.1.0"
description = "Reproducible experiment environment for the IPAT MSc Data Science dissertation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn>=1.6",
    "matplotlib>=3.8",
    "pyarrow",
    "h5py",
    "pyyaml",
    "pydantic",
    "optuna",
    "tqdm",
    "torch==2.13.0",
    "psutil>=5.9",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "jupyterlab",
    "ipykernel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]



